experiment:
  hutch: mfx
  experiment_id: mfx00000
  lcls_run: 1

data:
  runs: [1, 2, 3]
  keys:
    ipm4/sum: ipm
    lxt/ttc: lxt_ttc
    enc/lasDelay: encoder
  detector_keys:
    epix_1/ROI_0_area:
      name: epix
      rois: [[0, 80]]
      combine_rois: true

pipeline:
  - step: filter_shots
    on: xray
    filter_key: ipm
    threshold: 1000
  - step: filter_shots
    on: simultaneous
    filter_key: ipm
    threshold: 1000
  - step: filter_detector_adu
    on: epix_ROI_1
    adu_threshold: 1.0
  - step: union_shots
    on: epix_ROI_1
    filter_keys: [simultaneous, laser]
  - step: separate_shots
    on: epix_ROI_1
    filter_keys: [xray, laser]
  - step: time_binning
    bins: [-2, 10, 25]
    lxt_key: lxt_ttc
  - step: union_shots
    on: timing_bin_indices
    filter_keys: [simultaneous, laser]
  - step: separate_shots
    on: timing_bin_indices
    filter_keys: [xray, laser]
  - step: reduce_detector_temporal
    on: epix_ROI_1_simultaneous_laser
    timing_bin_key: timing_bin_indices_simultaneous_laser
  - step: reduce_detector_temporal
    on: epix_ROI_1_xray_not_laser
    timing_bin_key: timing_bin_indices_xray_not_laser
  - step: normalize_xes
    on: epix_ROI_1_simultaneous_laser_time_binned
  - step: normalize_xes
    on: epix_ROI_1_xray_not_laser_time_binned
  - step: make_energy_axis
    detector_key: epix_ROI_1
    crystal_detector_distance: 200.0
    crystal_radius: 250.0
    d_spacing: 1.637
    name: xes

reduction:
  - step: combine_runs
    detector_key: epix_ROI_1

output:
  format: hdf5
  path: ./results/
