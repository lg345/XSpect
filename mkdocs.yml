site_name: XSpect
site_description: X-ray spectroscopy analysis for LCLS (XES, XAS, RIXS)
repo_url: https://github.com/lg345/XSpect
site_author: XSpecT Team
copyright: © 2025 LCLS

# Point-in-time review doc kept in the repo but out of the published nav.
not_in_nav: |
  /2026-07-16_quarterly_review.md

nav:
  - Home: index.md
  - Overview: Overview.md
  - YAML pipeline guide: YAML_PIPELINE_GUIDE.md
  - Step reference:
    - Overview: steps/index.md
    - Loading & filtering: steps/loading_filtering.md
    - Detector & spatial: steps/detector.md
    - Binning: steps/binning.md
    - Spectra & reductions: steps/spectra.md
  - Examples:
    - XAS: Getting_started_XAS.md
    - XES: Getting_started_XES.md
    - Post-processing: Post_Processing.md
  - Source (YAML pipeline):
    - Model: source_model.md
    - Controller: source_controller.md
    - Analysis steps: source_analysis.md
  - Source (legacy):
    - XSpect_Analysis: XSpect_Analysis.md
    - XSpect_Controller: XSpect_Controller.md
    - XSpect_Diagnostics: XSpect_Diagnostics.md
    - XSpect_PostProcessing: XSpect_PostProcessing.md
    - XSpect_Visualization: XSpect_Visualization.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - toc:
      permalink: true

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-6
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-5
        name: Switch to light mode
